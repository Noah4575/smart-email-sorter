name: CI Pipeline - Smart Email Sorter

on:
    push:
        branches: [ main, "feature/**" ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            # 1. Récupération du code source
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Configuration de l'environnement Python
            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'

            # 3. Installation des dépendances
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            # 4. Test de fumée (Smoke Test) / Vérification des imports et de la config
            - name: Run structural tests
              run: |
                  python -c "import app.config; import app.schemas; import app.mcp_server; print('Tous les modules s\'importent et se configurent correctement !')"